spring.application.name=deliverycommands-api
server.port=${PORT:8080}

# --- Base de données : H2 embarquée, stockée dans le fichier ./data/deliverydb.mv.db ---
# (aucun serveur à installer ; pour MySQL/PostgreSQL il suffit de changer ces 3 lignes et le driver)
spring.datasource.url=jdbc:h2:file:./data/deliverydb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console web H2 (http://localhost:8080/h2-console) : utile en démonstration, à désactiver en production.
spring.h2.console.enabled=${H2_CONSOLE:true}

# --- Sécurité ---
# VALEURS DE DÉVELOPPEMENT UNIQUEMENT : à remplacer par des variables d'environnement en production.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.validity-minutes=120
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Crée 3 commandes fictives au premier démarrage pour que le tableau de bord ne soit pas vide.
app.seed.demo-orders=true
