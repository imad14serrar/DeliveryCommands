<section class="cart-section">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <h1 class="h3 fw-normal mb-4">Mon panier</h1>

        <ng-container *ngIf="items$ | async as items">
          <!-- Panier vide -->
          <div *ngIf="items.length === 0" class="text-center py-5 bg-white rounded-3 border">
            <i class="fa-solid fa-cart-shopping fa-3x text-muted mb-3"></i>
            <p class="lead">Votre panier est vide.</p>
            <a routerLink="/produits" class="btn btn-primary">Découvrir la boutique</a>
          </div>

          <div class="card rounded-3 mb-3" *ngFor="let item of items; trackBy: trackByProduct">
            <div class="card-body">
              <div class="row align-items-center g-3">
                <div class="col-4 col-lg-2 text-center">
                  <img [src]="item.product.imageUrl" class="img-fluid rounded-3" [alt]="item.product.name">
                </div>
                <div class="col-8 col-lg-3">
                  <p class="lead fw-normal mb-1">{{ item.product.name }}</p>
                  <p class="small text-muted mb-0">{{ item.product.price | currency }} / unité</p>
                </div>
                <div class="col-7 col-lg-3 d-flex align-items-center quantity-product">
                  <button class="btn btn-link px-2" (click)="decreaseQuantity(item)" [disabled]="item.quantity <= 1"
                          aria-label="Diminuer la quantité">
                    <i class="fas fa-minus"></i>
                  </button>
                  <input type="number" min="1" [max]="item.product.stock" [value]="item.quantity"
                         (change)="onQuantityInput(item, $event)" aria-label="Quantité"
                         class="form-control form-control-sm text-center quantity-input" />
                  <button class="btn btn-link px-2" (click)="increaseQuantity(item)"
                          [disabled]="item.quantity >= item.product.stock" aria-label="Augmenter la quantité">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
                <div class="col-3 col-lg-2 text-center price-element">
                  <h5 class="mb-0">{{ item.product.price * item.quantity | currency }}</h5>
                </div>
                <div class="col-2 col-lg-2 text-center trash-element">
                  <button class="btn btn-outline-danger trash-btn" (click)="removeItem(item)" aria-label="Retirer du panier">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div *ngIf="items.length > 0" class="text-center mt-4">
            <h2 class="h4 text-secondary mb-3 border border-2 rounded-3 p-3 bg-white">
              Total des produits : <span class="text-black ms-2">{{ total$ | async | currency }}</span>
            </h2>
            <a routerLink="/produits" class="btn btn-outline-secondary me-2">Continuer mes achats</a>
            <a routerLink="/livraison" class="btn btn-primary proceed-btn">Passer la commande</a>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</section>
